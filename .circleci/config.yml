version: 2.1
jobs:
  build:
    working_directory: ~/cubeball
    docker:
      - image: cimg/openjdk:25.0.4
    steps:
      - checkout
      - restore_cache:
          key: cubeball-{{ checksum "pom.xml" }}

      - save_cache:
          paths:
            - ~/.m2
          key: cubeball-{{ checksum "pom.xml" }}

      - run: mvn -B clean package

      - store_artifacts:
          path: /home/circleci/cubeball/target/cubeball-1.1.2.jar
