name: cubeball
main: me.crylonz.CubeBall
version: 1.0.0
author: Crylonz, squi2rel
description: Play football in Minecraft
api-version: "1.21.11"
folia-supported: true
softdepend:
  - CraftEngine
commands:
  ccb:
    permission: cubeball.manage
    description: Control command
    usage: /ccb [debug on|off|glow on|off|roll on|off|roll speed <number>|setballhand <match>|setballce <match> <namespace:id|clear>]
permissions:
  cubeball.manage:
    description: Allows player to manage cubeball
    default: op
  cubeball.admin:
    description: Manage all match
    default: op
