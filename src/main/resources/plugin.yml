name: cubeball
main: me.crylonz.CubeBall
version: 1.0.0
author: Crylonz, squi2rel, cloudfl4re
description: Play football in Minecraft
api-version: "1.21.11"
folia-supported: true
softdepend:
  - CraftEngine
  - emotecraft
  - BodySize
commands:
  ccb:
    permission: cubeball.manage
    description: Control command
    usage: /ccb [debug|glow|roll|setballhand|setballce|spawn]
permissions:
  cubeball.manage:
    description: Allows player to manage cubeball
    default: op
  cubeball.admin:
    description: Manage all match
    default: op
